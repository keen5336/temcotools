services:
  db:
    image: postgres@sha256:1d1095b0503145be79c79239372aefadfacf6b7c33c9245bbf99ce4b6b89c737
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops_tools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing or newly provisioned private database password}
      POSTGRES_DB: ops_tools
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - temco_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_tools -d ops_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: temcotools
    image: temcotools-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_FILE_MANAGER_ROOT: /data/admin-files
      DATABASE_URL: ${DATABASE_URL:?Set the private database URL for this composition}
      SESSION_SECRET: ${SESSION_SECRET:?Set a private session secret of at least 32 characters}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set and preserve the 32-byte base64url MFA encryption key}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/mcp}
      TRUST_PROXY: "true"
      PROTOCOL: "https"
      NODE_ENV: "production"
      NEXTAUTH_URL: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      NEXT_PUBLIC_APP_URL: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      API_RELAY_INTERNAL_URL: http://api-relay:3003
      API_RELAY_PUBLIC_ORIGIN: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      DMP_ORIGINS: ${DMP_ORIGINS-https://dmp.extapps.homedepot.com}
      DMP_IDENTITY_PATH: ${DMP_IDENTITY_PATH-/identity/me}
      DMP_IDENTITY_SUBJECT_PATH: ${DMP_IDENTITY_SUBJECT_PATH-subject}
      DMP_API_OPERATIONS: ${DMP_API_OPERATIONS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./runtime/admin-files:/data/admin-files
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/signin || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      temco_net:
        aliases:
          - temcotools.internal

  label-relay:
    image: temcotools-app
    command: ["node", "scripts/label-relay/server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      RELAY_APP_URL: http://app:3000
      RELAY_ORIGIN: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      RELAY_HOST: "0.0.0.0"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - temco_net

  api-relay:
    image: temcotools-app
    command: ["node", "scripts/api-relay/server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      DMP_ORIGINS: ${DMP_ORIGINS-https://dmp.extapps.homedepot.com}
      API_RELAY_HOST: "0.0.0.0"
      API_RELAY_APP_URL: http://app:3000
      API_RELAY_APP_ORIGIN: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - temco_net

  migrate:
    image: temcotools-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        VCS_REF: ${VCS_REF:-unknown}
    profiles:
      - maintenance
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private database URL for this composition}
    networks:
      - temco_net

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        VCS_REF: ${VCS_REF:-unknown}
    profiles:
      - mcp
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private database URL for this composition}
      NODE_ENV: production
      TEMCO_MCP_TOKEN: ${TEMCO_MCP_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/mcp}
      NEXT_PUBLIC_APP_URL: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      API_RELAY_INTERNAL_URL: http://api-relay:3003
    volumes:
      - ./runtime/admin-files:/data/admin-files
    depends_on:
      db:
        condition: service_healthy
    networks:
      - temco_net

  mcp-http:
    image: temcotools-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        VCS_REF: ${VCS_REF:-unknown}
    profiles: [mcp-http]
    command: ["node", "--import", "tsx", "scripts/mcp-http-server.ts"]
    restart: unless-stopped
    ports: ["127.0.0.1:3004:3004"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private database URL for this composition}
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}/mcp}
      NEXT_PUBLIC_APP_URL: ${TEMCO_PUBLIC_ORIGIN:-https://temco.chronchive.com}
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "3004"
      API_RELAY_INTERNAL_URL: http://api-relay:3003
    volumes:
      - ./runtime/admin-files:/data/admin-files
    depends_on:
      db:
        condition: service_healthy
    networks: [temco_net]

networks:
  temco_net:
    driver: bridge

volumes:
  db_data:
